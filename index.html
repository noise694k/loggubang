<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#F5F2EC">
<meta name="color-scheme" content="light">
<title>로꾸방</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='12' fill='%23B4472F'/%3E%3Ctext x='32' y='43' font-size='30' text-anchor='middle' fill='%23fff' font-family='serif'%3E%EB%A1%9C%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#F5F2EC; --bg-2:#EDE8DF; --surface:#FFFFFF; --surface-2:#FAF8F4;
  --ink:#24221F; --ink-2:#57524A; --muted:#8C867B; --faint:#B5AEA2;
  --line:#E4DED3; --line-2:#EFEAE2;
  --accent:#B4472F; --accent-ink:#8E3522; --accent-soft:#F7E6E0;
  --ok:#3E7A58; --ok-soft:#E3F0E8; --warn:#9A6514; --warn-soft:#FAF0DC; --danger:#B23A2A;
  --r:14px; --r-sm:10px;
  --topH:52px; --tabH:58px;
  --f-ui:system-ui,-apple-system,'Segoe UI','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-serif:'Noto Serif KR','Noto Serif CJK KR','AppleMyungjo','Batang',serif;
  --f-mono:ui-monospace,'D2Coding','Nanum Gothic Coding',Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(36,34,31,.05),0 6px 20px rgba(36,34,31,.06);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}
body{font-family:var(--f-ui);font-size:14.5px;line-height:1.5;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ── 앱 골격 ── */
.app{display:flex;flex-direction:column;height:100dvh;height:100vh;height:100dvh}
.top{flex:none;height:calc(var(--topH) + env(safe-area-inset-top));padding:env(safe-area-inset-top) 10px 0 12px;display:flex;align-items:center;gap:10px;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{min-width:0;display:flex;flex-direction:column;line-height:1.15;flex:1;border:0;background:none;padding:2px 0;text-align:left}
.brand b{font-family:var(--f-serif);font-size:17px;letter-spacing:.08em;font-weight:700;color:var(--ink)}
.brand span{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw}
.top .acts{display:flex;align-items:center;gap:2px}
.ib{width:40px;height:40px;border-radius:12px;border:0;background:none;display:grid;place-items:center;color:var(--ink-2)}
.ib:active{background:var(--bg-2)}
.ib[disabled]{opacity:.32;pointer-events:none}
.savedot{width:8px;height:8px;border-radius:50%;background:var(--ok);margin:0 8px 0 4px;transition:background .2s}
.savedot.dirty{background:var(--warn)}
.savedot.err{background:var(--danger)}

.work{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.pv{flex:none;height:var(--pvh,38vh);display:flex;flex-direction:column;background:#E7E2D9;border-bottom:1px solid var(--line);min-height:0;transition:height .18s ease}
.pv.hide{height:0;border:0;overflow:hidden}
.pv.full{flex:1;height:auto}
.pvbar{flex:none;display:flex;align-items:center;gap:6px;padding:6px 8px;overflow-x:auto;scrollbar-width:none}
.pvbar::-webkit-scrollbar{display:none}
.pvbar .sp{flex:1}
.mini{display:inline-flex;border:1px solid var(--line);background:var(--surface-2);border-radius:99px;padding:2px;gap:2px;flex:none}
.mini button{border:0;background:none;border-radius:99px;padding:4px 9px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.mini button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.mini .mlab{align-self:center;font-size:10.5px;color:var(--muted);padding:0 4px 0 8px;white-space:nowrap;letter-spacing:.02em}
.pvhelp{width:28px;height:28px;justify-content:center;align-items:center;font-size:13px;color:var(--ink-2);padding:0}
.pv.full ~ .panel{display:none}
.pvback{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:3;border:0;border-radius:99px;background:var(--ink);color:#fff;padding:9px 16px;font-size:13px;box-shadow:var(--shadow)}
.pvbox{flex:1;min-height:0;position:relative;overflow:hidden}
.pvscale{position:absolute;left:0;top:0;transform-origin:0 0}
.pvbox iframe{display:block;border:0;width:100%;height:100%;background:#fff}
.pvchip{position:absolute;right:10px;bottom:10px;z-index:3;border:0;border-radius:99px;background:var(--ink);color:#fff;padding:8px 14px;font-size:13px;box-shadow:var(--shadow);display:flex;gap:6px;align-items:center}
.grip{flex:none;height:14px;margin-top:-7px;margin-bottom:-7px;position:relative;z-index:4;touch-action:none;cursor:row-resize;display:grid;place-items:center}
.grip::after{content:"";width:44px;height:5px;border-radius:9px;background:#CFC7B9}
.pv.hide + .grip,.pv.full + .grip{display:none}

.panel{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:14px 14px calc(24px + env(safe-area-inset-bottom))}
.panel.ed{display:flex;flex-direction:column;padding-bottom:10px;overflow-y:auto}
/* 키보드가 올라와 화면이 좁아졌을 때(html.kb): 글 칸이 가려지지 않게 미리보기·아래 탭·위 버튼을 줄임 */
html.kb .tabs{display:none}
html.kb .pv:not(.hide):not(.full){max-height:30%}
html.kb .pvbar{display:none}
html.kb .panel.ed .edtop,html.kb .panel.ed .tbhead,html.kb .panel.ed .edfoot{display:none}
html.kb .panel.ed .tb{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
html.kb .panel.ed .tb::-webkit-scrollbar{display:none}
html.kb .panel.ed{padding-top:8px;padding-bottom:6px}
html.kb #ed{min-height:60px}
.tabs{flex:none;height:calc(var(--tabH) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;color:var(--muted);position:relative}
.tab svg.i{width:22px;height:22px}
.tab.on{color:var(--accent)}
.tab.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;border-radius:0 0 3px 3px;background:var(--accent)}

@media (min-width:980px){
  .work{display:grid;grid-template-columns:minmax(380px,460px) 1fr;grid-template-rows:1fr}
  .panel{grid-column:1;grid-row:1;border-right:1px solid var(--line)}
  .pv,.pv.hide,.pv.full{grid-column:2;grid-row:1;height:auto!important;border:0;overflow:visible}
  .grip,.pvsize,.mob,.pvback{display:none!important}
  .pv.full ~ .panel{display:block}
  .app{display:grid;grid-template-rows:auto 1fr auto}
}

/* ── 공통 요소 ── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 12px}
.card>h3{margin:0 0 10px;font-size:13.5px;font-weight:700;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.card>h3 small{font-weight:400;color:var(--muted);font-size:12px}
.help{display:block;color:var(--muted);font-size:12px;line-height:1.55;margin:4px 0 0}
.help b{color:var(--ink-2)}
.note{border-radius:var(--r-sm);padding:10px 12px;font-size:12.5px;line-height:1.6;margin:8px 0;background:var(--bg);color:var(--ink-2)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.note.err{background:#F8E3E0;color:var(--danger)}
.note ul{margin:4px 0 0;padding-left:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:13.5px;white-space:nowrap}
.btn:active{background:var(--bg-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:active{background:var(--accent-ink)}
.btn.ghost{background:none}
.btn.warn{color:var(--danger);border-color:#EBC9C3}
.btn.sm{min-height:34px;padding:5px 11px;font-size:12.5px;border-radius:10px}
.btn.full{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn svg.i{width:18px;height:18px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.nw{flex-wrap:nowrap}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input[type=text],input[type=url],input[type=number],input[type=search],input[type=password],select,textarea.in{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:14px;min-height:40px;outline:none}
input:focus,select:focus,textarea:focus{border-color:#CDB8A8;box-shadow:0 0 0 3px rgba(180,71,47,.10)}
textarea.in{resize:vertical;line-height:1.55}
.mono{font-family:var(--f-mono);font-size:12.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip:active{transform:scale(.97)}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--bg-2);color:var(--ink-2);font-weight:500;vertical-align:1px}
.badge.acc{background:var(--accent-soft);color:var(--accent-ink)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;margin:0;font-size:12.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:13px}
hr.sep{border:0;border-top:1px solid var(--line-2);margin:12px 0}

/* ── 아코디언 섹션 ── */
details.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin:0 0 10px;overflow:hidden}
details.sec>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer;user-select:none}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary .ttl{font-weight:700;font-size:14px}
details.sec>summary .sub{color:var(--muted);font-size:12px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
details.sec>summary::after{content:"";width:8px;height:8px;border-right:1.7px solid var(--faint);border-bottom:1.7px solid var(--faint);transform:rotate(45deg) translate(-2px,-2px);transition:transform .15s;flex:none}
details.sec[open]>summary::after{transform:rotate(-135deg) translate(-1px,-1px)}
details.sec>.body{padding:2px 14px 14px;border-top:1px solid var(--line-2)}
.sub-h{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em;margin:14px 0 4px}

/* ── 컨트롤 ── */
.ctl{padding:9px 0;border-bottom:1px dashed var(--line-2)}
.ctl:last-child{border-bottom:0}
.ctl .lab{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);min-height:28px}
.ctl .lab>span:first-child{flex:1;min-width:0}
.ctl .lab small{color:var(--muted);font-size:11.5px}
.ctl .num{width:76px;min-height:30px;padding:4px 8px;font-size:13px;text-align:right;border-radius:8px}
.ctl .unit{font-size:11.5px;color:var(--muted);min-width:16px}
.ctl input[type=range]{width:100%;margin:6px 0 0;accent-color:var(--accent);height:22px}
.ctl.inline{display:flex;align-items:center;gap:10px}
.ctl.inline .lab{flex:1}
.ctl select{min-height:34px;padding:5px 9px;font-size:13px;width:auto;max-width:60%}
.ctl input[type=text]{min-height:34px;padding:6px 10px;font-size:13.5px}
.ctl .txt{margin-top:4px}
.sw{display:flex;align-items:center;gap:6px}
.sw .dot{position:relative;width:30px;height:30px;border-radius:50%;border:1px solid rgba(0,0,0,.14);overflow:hidden;flex:none;background-image:linear-gradient(45deg,#ddd 25%,transparent 25%,transparent 75%,#ddd 75%),linear-gradient(45deg,#ddd 25%,#fff 25%,#fff 75%,#ddd 75%);background-size:10px 10px;background-position:0 0,5px 5px}
.sw .dot i{position:absolute;inset:0}
.sw .dot input{position:absolute;inset:-6px;width:calc(100% + 12px);height:calc(100% + 12px);opacity:0;cursor:pointer;border:0;padding:0}
.sw .hex{width:86px;min-height:30px!important;padding:4px 8px!important;font-family:var(--f-mono);font-size:12px!important;border-radius:8px!important}
.sw .clr{border:0;background:none;color:var(--muted);font-size:12px;padding:4px}
.swatches{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.swatches button{width:22px;height:22px;border-radius:50%;border:1px solid rgba(0,0,0,.12);padding:0}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;padding:2px;gap:2px;background:var(--surface-2);margin-top:6px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:6px 6px;font-size:12.5px;color:var(--ink-2);white-space:nowrap;min-width:0}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1);font-weight:600}
.tg{position:relative;width:42px;height:24px;flex:none}
.tg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
.tg span{position:absolute;inset:0;border-radius:99px;background:#D6CFC3;transition:background .15s}
.tg span::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .15s}
.tg input:checked+span{background:var(--accent)}
.tg input:checked+span::after{transform:translateX(18px)}
.fontbtn{display:flex;align-items:center;gap:8px;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 11px;margin-top:6px;text-align:left;min-height:40px}
.fontbtn b{flex:1;font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fontbtn small{color:var(--muted);font-size:11.5px}

/* ── 편집기 ── */
.edtop{flex:none;display:flex;gap:6px;overflow-x:auto;padding:0 0 8px;scrollbar-width:none}
.edtop::-webkit-scrollbar{display:none}
.edtop .btn{flex:none}
.tbwrap{flex:none;margin:0 0 8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tbhead{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 12px;border-bottom:1px solid var(--line-2);font-size:12px;color:var(--muted)}
.tbhead .hint{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbhead .hint.sel{color:var(--accent-ink);font-weight:600}
.tbhead button{border:0;background:var(--bg);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--ink-2)}
.tbwrap.closed .tb{display:none}
.tbwrap.closed .tbhead{border-bottom:0}
.tb{display:flex;flex-wrap:wrap;gap:3px;padding:6px;align-items:center}
.tb button{flex:none;min-width:34px;height:34px;border:0;border-radius:9px;background:none;display:grid;place-items:center;color:var(--ink-2);font-size:14px;padding:0 7px;position:relative}
.tb button:active,.tb button.on{background:var(--bg-2)}
.tb .div{width:1px;height:22px;background:var(--line);margin:0 3px;flex:none}
.tb .hlb{display:flex;align-items:center;gap:4px}
.tb .hlb i{display:block;width:16px;height:12px;border-radius:3px}
.tb .lbl{font-size:12.5px;white-space:nowrap}
#ed{flex:1;min-height:120px;width:100%;resize:none;border:1px solid var(--line);border-radius:12px;padding:12px 13px;background:var(--surface);font-size:var(--edfs,15px);line-height:1.7;outline:none;font-family:var(--f-ui);white-space:pre-wrap;overflow-wrap:anywhere}
#ed:focus{border-color:#CDB8A8}
.edfoot{flex:none;display:flex;gap:10px;align-items:center;font-size:11.5px;color:var(--muted);padding:6px 2px 0;flex-wrap:wrap}
.edfoot .sp{flex:1}
.edfoot .pn{color:var(--ink-2);font-weight:600;max-width:40vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:3px 10px;background:var(--surface);font-size:12px;color:var(--ink-2)}
.pill input{accent-color:var(--accent);margin:0}

/* ── 시트(하단 패널) ── */
.scrim{position:fixed;inset:0;background:rgba(30,26,20,.38);z-index:50;opacity:0;transition:opacity .18s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--bg);border-radius:18px 18px 0 0;max-height:90dvh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .22s ease;box-shadow:0 -8px 30px rgba(0,0,0,.14)}
.sheet.on{transform:none}
@media (min-width:720px){.sheet{left:50%;width:640px;margin-left:-320px}}
.sheet .sh{flex:none;display:flex;align-items:center;gap:8px;padding:12px 10px 10px 16px;border-bottom:1px solid var(--line)}
.sheet .sh h2{margin:0;font-size:15.5px;flex:1;font-weight:700}
.sheet .sb{flex:1;min-height:0;overflow-y:auto;padding:14px 14px calc(18px + env(safe-area-inset-bottom));overscroll-behavior:contain}
.sheet .sf{flex:none;padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:8px;background:var(--surface-2)}
.sheet .sf .btn{flex:1}
.toast{position:fixed;left:50%;bottom:calc(var(--tabH) + 18px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;z-index:80;opacity:0;transition:all .2s;pointer-events:none;max-width:88vw;text-align:center;line-height:1.5}
.toast.on{opacity:1;transform:translateX(-50%)}
.toast.err{background:var(--danger)}
.pop{position:fixed;z-index:60;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.16);padding:10px;max-width:calc(100vw - 20px)}

/* ── 글꼴 고르기 ── */
.fcat{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
.fcat::-webkit-scrollbar{display:none}
.flist{display:flex;flex-direction:column;gap:6px}
.fitem{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:left;width:100%}
.fitem.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.fitem .fn{flex:1;min-width:0}
.fitem .fn b{display:block;font-size:14px;font-weight:600}
.fitem .fn small{color:var(--muted);font-size:11.5px}
.fitem .smp{display:block;font-size:17px;line-height:1.35;color:var(--ink);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fitem .pvb{flex:none;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;font-size:11.5px;padding:5px 8px;color:var(--ink-2)}

/* ── 목록·기타 ── */
.list{display:flex;flex-direction:column;gap:8px}
.litem{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.litem.on{border-color:var(--accent)}
.litem .m{flex:1;min-width:0}
.litem .m b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.litem .m small{color:var(--muted);font-size:11.5px}
.msgrow{display:flex;gap:10px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--line-2)}
.msgrow input[type=checkbox]{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:none}
.msgrow .mm{flex:1;min-width:0}
.msgrow .mh{display:flex;gap:6px;align-items:center;font-size:12.5px;flex-wrap:wrap}
.msgrow .mh b{font-size:13px}

const isObj = o => o && typeof o === 'object' && !Array.isArray(o);
function deepMerge(base, over) {
  if (!isObj(base) || !isObj(over)) return over === undefined ? base : over;
  const out = { ...base };
  for (const k of Object.keys(over)) out[k] = isObj(base[k]) && isObj(over[k]) ? deepMerge(base[k], over[k]) : over[k];
  return out;
}
function getPath(o, p) { return p.split('.').reduce((a, k) => (a == null ? a : a[k]), o); }
function setPath(o, p, v) { const ks = p.split('.'); const last = ks.pop(); const t = ks.reduce((a, k) => (isObj(a[k]) || Array.isArray(a[k]) ? a[k] : (a[k] = {})), o); t[last] = v; }
function fmtBytes(n) { if (n < 1024) return n + ' B'; if (n < 1048576) return (n / 1024).toFixed(1) + ' KB'; return (n / 1048576).toFixed(2) + ' MB'; }
function byteLen(s) { return new Blob([s]).size; }
function safeName(s) { return String(s || 'log').replace(/[\\/:*?"<>|\n\r\t]+/g, '_').trim().slice(0, 60) || 'log'; }
function h(tag, attrs, ...kids) {
  const m = /^([a-z0-9]+)((?:[.#][\w-]+)*)$/i.exec(tag);
  const el = document.createElement(m ? m[1] : tag);
  if (m && m[2]) for (const part of m[2].match(/[.#][\w-]+/g)) part[0] === '.' ? el.classList.add(part.slice(1)) : (el.id = part.slice(1));
  if (attrs != null && (attrs instanceof Node || Array.isArray(attrs) || typeof attrs !== 'object')) { kids.unshift(attrs); attrs = null; }
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k in el && k !== 'list' && typeof v !== 'string') el[k] = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(9)) if (c != null && c !== false) el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return el;
}
const ICON = {
  plus: '<path d="M12 5v14M5 12h14"/>', trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  copy: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>',
  down: '<path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/>', up: '<path d="M12 21V9"/><path d="m7 14 5-5 5 5"/><path d="M5 3h14"/>',

/* ── 진단 로그 (모바일에서 확인용) ── */
const Log = {
  items: [],
  add(lvl, msg, detail) {
    this.items.push({ t: new Date(), lvl, msg: String(msg), detail: detail == null ? '' : String(detail).slice(0, 2000) });
    if (this.items.length > 300) this.items.shift();
  },
  info(m, d) { this.add('i', m, d); }, warn(m, d) { this.add('w', m, d); }, err(m, d) { this.add('e', m, d); },
  text() { return this.items.map(x => `[${x.t.toTimeString().slice(0, 8)}] ${x.lvl === 'e' ? '오류' : x.lvl === 'w' ? '주의' : '정보'} ${x.msg}${x.detail ? '\n    ' + x.detail : ''}`).join('\n'); }
};
window.addEventListener('error', e => Log.err('스크립트 오류: ' + (e.message || e), (e.filename || '') + ':' + (e.lineno || '') + ' ' + (e.error && e.error.stack || '')));
window.addEventListener('unhandledrejection', e => Log.err('처리 안 된 오류: ' + (e.reason && e.reason.message || e.reason), e.reason && e.reason.stack));

function toast(msg, kind = '', ms = 2600) {
  const t = $('#toast'); t.textContent = msg; t.className = 'toast on ' + kind;
  clearTimeout(toast._t); toast._t = setTimeout(() => (t.className = 'toast'), ms);
}

/* ── 저장소 (IndexedDB) ── */
const DB = {
  db: null, ok: false,
  async open() {
    if (!('indexedDB' in window)) { Log.warn('IndexedDB 없음 — 저장되지 않아요'); return; }
    try {
      this.db = await new Promise((res, rej) => {
        const rq = indexedDB.open(DB_NAME, 1);
        rq.onupgradeneeded = () => {
          const d = rq.result;
          if (!d.objectStoreNames.contains('projects')) d.createObjectStore('projects', { keyPath: 'id' });
          if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv', { keyPath: 'k' });
          if (!d.objectStoreNames.contains('blobs')) d.createObjectStore('blobs', { keyPath: 'k' });
        };
        rq.onsuccess = () => res(rq.result);
        rq.onerror = () => rej(rq.error);
        rq.onblocked = () => rej(new Error('다른 탭에서 저장소를 쓰고 있어요'));
      });
      this.ok = true;
    } catch (e) { Log.err('저장소 열기 실패', e && e.message); }
  },
  tx(store, mode, fn) {
    if (!this.ok) return Promise.resolve(undefined);
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode); const s = t.objectStore(store);
      let out; const r = fn(s); if (r) r.onsuccess = () => (out = r.result);
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('저장 중단'));
    });
  },
  get(store, key) { return this.tx(store, 'readonly', s => s.get(key)); },
  put(store, val) { return this.tx(store, 'readwrite', s => s.put(val)); },
  del(store, key) { return this.tx(store, 'readwrite', s => s.delete(key)); },
  all(store) { return this.tx(store, 'readonly', s => s.getAll()); },
  async kv(k, d) { try { const r = await this.get('kv', k); return r ? r.v : d; } catch (e) { return d; } },
  setkv(k, v) { return this.put('kv', { k, v }); }
};

/* ── 되돌리기 ── */
const Hist = {
  stack: [], idx: -1, max: 80, quiet: false,
  snap() { return { text: P.text, style: JSON.stringify(P.style), rules: JSON.stringify(P.rules), meta: JSON.stringify(P.meta), sel: Ed.sel() }; },
  same(a, b) { return a && b && a.text === b.text && a.style === b.style && a.rules === b.rules && a.meta === b.meta; },
  reset() { this.stack = [this.snap()]; this.idx = 0; this.ui(); },
  push() {
    if (this.quiet || !P) return;
    const s = this.snap(); if (this.same(this.stack[this.idx], s)) return;
    this.stack = this.stack.slice(0, this.idx + 1); this.stack.push(s);
    let total = this.stack.reduce((a, x) => a + x.text.length, 0);
    while (this.stack.length > this.max || (total > 40e6 && this.stack.length > 2)) { total -= this.stack[0].text.length; this.stack.shift(); }
    this.idx = this.stack.length - 1; this.ui();
  },
  flush() { commitLater.cancel(); this.push(); },
  undo() { this.flush(); if (this.idx <= 0) return; this.idx--; this.apply(this.stack[this.idx], this.stack[this.idx + 1].sel); },
  redo() { this.flush(); if (this.idx >= this.stack.length - 1) return; this.idx++; this.apply(this.stack[this.idx], this.stack[this.idx].sel); },
  apply(s, sel) {
    this.quiet = true;
    P.text = s.text; P.style = JSON.parse(s.style); P.rules = JSON.parse(s.rules); P.meta = JSON.parse(s.meta);
    Ed.setValue(P.text, sel); UI.refresh(); render(); markDirty();
    this.quiet = false; this.ui();
  },
  ui() { $('#btnUndo').disabled = this.idx <= 0; $('#btnRedo').disabled = this.idx >= this.stack.length - 1; }
};
const commitLater = debounce(() => Hist.push(), 650);
function commit(now) { if (now) Hist.flush(); else commitLater(); markDirty(); }

function gcAssets(p) {
  const refs = new Set(); const scan = s => { for (const m of String(s).matchAll(/asset:([a-z0-9]+)/g)) refs.add(m[1]); };
  scan(p.text); scan(JSON.stringify(p.style));
  for (const k of Object.keys(p.assets)) if (!refs.has(k)) delete p.assets[k];
}

/* ═════════ 본문 편집기 ═════════
   형광펜·굵게 등은 '선택 → 버튼'으로 원문에 [hl=1]…[/hl] 같은 표시를 감쌈 (가장 안정적인 방식) */
const Ed = {
  ta: null, lastHl: 1, lastColor: '#C0392B',
  sel() { return this.ta ? [this.ta.selectionStart, this.ta.selectionEnd] : [0, 0]; },
  setValue(v, sel) {

  },
  changed(now) { P.text = this.ta.value; renderLater(); commit(now); },
  replaceRange(s, e, text, selS, selE) {

  needSel() { const [s, e] = this.sel(); if (s === e) { toast('먼저 꾸밀 글자를 길게 눌러 선택하세요'); return null; } return [s, e]; },
  /* 글자 감싸기 (여러 줄이면 줄마다 따로 감쌈) */
  wrap(open, close) {

    const [s, e] = r; const v = this.ta.value; const sel = v.slice(s, e);

    }

    }

  lineRange() {

/* ── 시트 (안드로이드 뒤로가기로 닫힘) ── */
/* 기록 항목은 '시트가 열린 상태' 하나만 씀. 코드로 닫을 때는 history.back()을 부르지 않음
   (곧바로 다른 시트를 열면 뒤로가기가 엇갈려 앱 밖으로 나가는 문제가 있어서) */

  const top = SheetStack[SheetStack.length - 1]; if (!top) return;
  top.close();

});
function openSheet(title, build, opt = {}) {
  const scrim = h('div.scrim', { style: { zIndex: sheetZ } });
  const body = h('div.sb'); const foot = opt.foot ? h('div.sf') : null;
  const sheet = h('div.sheet', { style: { zIndex: sheetZ + 1 }, role: 'dialog', 'aria-label': title },
    h('div.sh', h('h2', title), h('button.ib', { type: 'button', 'aria-label': '닫기', html: ico('x'), onclick: () => api.close() })), body, foot);
  sheetZ += 2;

    body, sheet,

const SAMPLE = '다람쥐 헌 쳇바퀴에 타고파 · Aa 123';

function chooseFile(accept) {

/* square: 가운데를 정사각형으로 잘라서 (프로필 사진) */
async function compressImage(file, maxW = 1600, q = 0.84, square = false) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, no) => { const im = new Image(); im.onload = () => ok(im); im.onerror = () => no(new Error('이미지를 읽지 못했어요')); im.src = url; });
    const sw = square ? Math.min(img.naturalWidth, img.naturalHeight) : img.naturalWidth, sh = square ? sw : img.naturalHeight;
    const sx = (img.naturalWidth - sw) / 2, sy = (img.naturalHeight - sh) / 2;
    const k = Math.min(1, maxW / sw); const w = Math.round(sw * k), hh = Math.round(sh * k);
    const c = h('canvas', { width: w, height: hh }); c.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, w, hh);
    let d = c.toDataURL('image/webp', q); if (!d.startsWith('data:image/webp')) d = c.toDataURL('image/jpeg', q);
    c.width = c.height = 0;
    return { data: d, w, h: hh };
  } finally { URL.revokeObjectURL(url); }
}
async function pickImageAsset(maxW = 1400, square = false) {
  const f = await chooseFile('image/*'); if (!f) return null;
  try {
    const r = await compressImage(f, maxW, 0.84, square);
    const id = uid().replace(/[^a-z0-9]/g, ''); P.assets[id] = r.data; markDirty();
    toast(`그림을 ${r.w}×${r.h}, ${fmtBytes(r.data.length * 0.75)}로 줄여 넣었어요`);
    return id;
  } catch (e) { toast(e.message || '이미지 처리 실패', 'err'); return null; }
}
function downloadBlob(blob, name) {
  const u = URL.createObjectURL(blob); const a = h('a', { href: u, download: name }); document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 4000);
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; } catch (e) {
    const ta = h('textarea', { style: { position: 'fixed', left: '-9999px' } }); ta.value = t; document.body.append(ta); ta.select();

function decodeEntities(s) {
  const map = { amp: '&', lt: '<', gt: '>', quot: '"', apos: "'", nbsp: ' ', hellip: '…', middot: '·', lsquo: '‘', rsquo: '’', ldquo: '“', rdquo: '”' };

    return map[k.toLowerCase()] ?? m;

}
function toCurly(t) {

      else if (c === "'") {
        if (p && /[A-Za-z0-9]/.test(p) && n && /[A-Za-z]/.test(n)) out += '’';
        else out += (!p || /[\s(\[{「『<]/.test(p)) ? '‘' : '’';
      } else out += c;
    }
    return out;
  }).join('\n');
}
const CLEAN_OPTS = [
  ['think', '<think>·<thinking> 생각 블록 지우기'], ['html', 'HTML 태그 지우기 (영문 태그만, <상태창> 같은 한글 꺾쇠는 남김)'], ['code', '``` 코드 블록(상태창 등) 통째로 지우기'],
  ['ooc', 'OOC 지우기 — ((…)) · (OOC: …) · [OOC: …]'], ['ellipsis', '... → … 로 통일'], ['trim', '줄 끝 공백 지우기'], ['blank', '빈 줄 3개 이상 → 1개로']
];
function defaultClean() { return { think: true, html: true, code: false, ooc: false, ellipsis: false, trim: true, blank: true, quotes: 'none' }; }
function cleanText(t, o) {
  t = String(t || '').replace(/\r\n?/g, '\n');
  if (o.think) t = t.replace(/<(think|thinking|reasoning|reflection)\b[^>]*>[\s\S]*?<\/\1\s*>/gi, '');
  if (o.code) t = t.replace(/```[\s\S]*?```/g, '');
  if (o.html) {
    t = t.replace(/<(style|script)\b[\s\S]*?<\/\1\s*>/gi, '').replace(/<br\s*\/?>/gi, '\n').replace(/<\/(p|div|li|h[1-6]|tr|blockquote|details|summary)\s*>/gi, '\n')
      .replace(/<\/?[A-Za-z][\w:-]*(\s[^<>]*)?\/?>/g, '');
    t = decodeEntities(t);
  }
  if (o.ooc) t = t.replace(/\(\([\s\S]*?\)\)/g, '').replace(/[(\[]\s*OOC\s*[:：][^)\]]*[)\]]/gi, '');
  if (o.ellipsis) t = t.replace(/\.{3,}/g, m => '…'.repeat(Math.max(1, Math.round(m.length / 3))));

  const root = document.documentElement; let base = window.innerHeight, baseW = window.innerWidth;
  const typing = () => { const a = document.activeElement; return !!a && (a.tagName === 'TEXTAREA' || (a.tagName === 'INPUT' && !/^(checkbox|radio|range|color|button|file)$/.test(a.type))); };
  const check = () => {
    const w = window.innerWidth, hgt = window.visualViewport ? Math.min(window.innerHeight, window.visualViewport.height) : window.innerHeight;
    if (w !== baseW) { baseW = w; base = hgt; }   // 화면을 돌렸으면 기준 다시
    if (!typing() && hgt > base) base = hgt;
    const on = typing() && hgt < base * 0.78;
    if (on !== root.classList.contains('kb')) {
      root.classList.toggle('kb', on);
      requestAnimationFrame(() => { const p = $('#panel'); if (p && APPST.tab === 'text') p.scrollTop = 0; PV.layout(); if (on && document.activeElement === Ed.ta) Ed.scrollToSel(); });
    }
  };
  (window.visualViewport || window).addEventListener('resize', check);
  window.addEventListener('resize', check);
  document.addEventListener('focusin', () => setTimeout(check, 350));
  document.addEventListener('focusout', () => setTimeout(check, 120));
}

  if (!p) { p = newProject('첫 로그'); await DB.put('projects', p); }
  P = normalizeProject(p); gcAssets(P);
  document.documentElement.style.setProperty('--edfs', (APPST.prefs.edfs || 15) + 'px');
  const panel = $('#panel');

  PANES.text.dataset.built = '1'; PANES.text.style.cssText = 'display:flex;flex-direction:column;flex:1;min-height:0';
  buildTextPanel(PANES.text);

  $('#brand').onclick = () => switchTab('more');
  $$('#tabs .tab').forEach(b => (b.onclick = () => switchTab(b.dataset.tab)));
  $$('#pvSize button').forEach(b => (b.onclick = () => setPvSize(b.dataset.v)));
  $('#pvBack').onclick = () => setPvSize('m');
  $('#pvHelp').onclick = () => openSheet('미리보기 막대', body => body.append(h('dl.kv', { style: { fontSize: '13.5px', gap: '10px 14px' } },
    h('dt', '미리보기 창'), h('dd', '위쪽 미리보기가 화면을 얼마나 차지할지예요. [전체]는 미리보기만 크게 보여 주고, 아래 [설정 화면으로 돌아가기]로 돌아와요. 경계선(회색 막대)을 끌어서 높이를 바꿀 수도 있어요.'),
    h('dt', '보는 폭'), h('dd', '결과가 어떤 화면 폭에서 어떻게 보일지 흉내 내요. [이 화면]은 지금 기기 폭, [폰]은 390px, [PC]는 960px 화면이에요. 미리보기에만 영향이 있고 HTML 코드는 바뀌지 않아요. (이미지 폭은 내보내기 탭에서 따로 정해요)'),
    h('dt', '사이트 바탕'), h('dd', '로그 바깥, 사이트 게시판의 바탕색을 흉내 내요. 흰 바탕 사이트·어두운 사이트에서 어떻게 보일지 확인용이고 결과물엔 영향이 없어요.'))));
  const mini = (sel, key, after) => $$(sel + ' button').forEach(b => { b.classList.toggle('on', b.dataset.v === APPST.prefs[key]); b.onclick = () => { APPST.prefs[key] = b.dataset.v; $$(sel + ' button').forEach(x => x.classList.toggle('on', x === b)); savePrefsLater(); after(); }; });
  mini('#pvWidth', 'pvW', () => { PV.layout(); OutPanel.updInfo && OutPanel.updInfo(); }); mini('#pvBg', 'pvBg', () => PV.applyBg());
  initGrip(); PV.init();
  switchTab(APPST.prefs.lastTab && PANES[APPST.prefs.lastTab] ? APPST.prefs.lastTab : 'text');
  window.addEventListener('resize', debounce(() => { if (!document.documentElement.classList.contains('kb')) setPvSize(APPST.prefs.pv[APPST.tab] || 'm', false); }, 200));
  initKeyboardWatch();
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { Hist.flush(); saveNow(); } });
  window.addEventListener('pagehide', () => { saveNow(); });
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().then(ok => Log.info('영구 저장 요청', ok ? '허용됨' : '브라우저가 보류')); } catch (e) {}
  Log.info('시작', `v${APP_VER} · 로그 ${P.name}`);
}
